steps:
  - label: "Workspace mount test - writer"
    command:
      - "hostname"
      - "echo host=$(hostname) > /workspace/shared_test.txt"
      - "date >> /workspace/shared_test.txt"
      - "ls -la /workspace"
    agents:
      queue: kubernetes

  - wait

  - label: "Workspace mount test - reader"
    command:
      - "hostname"
      - "echo '--- previous step file check ---'"
      - "cat /workspace/shared_test.txt || echo 'FILE NOT FOUND'"
      - "ls -la /workspace"
    agents:
      queue: kubernetes
