steps:
  - label: "Setup: create PVC + upload rest of pipeline"
    command:
      - |
        BUILD_PVC="bk-build-${BUILDKITE_BUILD_ID}"
        echo "Build PVC name: ${BUILD_PVC}"

        cat <<PVCEOF | kubectl apply -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${BUILD_PVC}
          namespace: buildkite
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: nfs-client-bamboo-pv9
          resources:
            requests:
              storage: 5Gi
        PVCEOF

        kubectl wait --for=jsonpath='{.status.phase}'=Bound "pvc/${BUILD_PVC}" -n buildkite --timeout=60s

        cat <<PIPELINEEOF | buildkite-agent pipeline upload
        steps:
          - label: "Writer step"
            command:
              - "hostname"
              - "echo host=\$(hostname) build=${BUILD_PVC} > /build-pvc/shared_test.txt"
              - "date >> /build-pvc/shared_test.txt"
              - "ls -la /build-pvc"
            agents:
              queue: kubernetes
            plugins:
              - kubernetes:
                  podSpecPatch:
                    containers:
                      - name: container-0
                        volumeMounts:
                          - name: build-pvc
                            mountPath: /build-pvc
                    volumes:
                      - name: build-pvc
                        persistentVolumeClaim:
                          claimName: ${BUILD_PVC}

          - label: "Reader step"
            depends_on: "Writer step"
            command:
              - "hostname"
              - "echo '--- checking file from previous step ---'"
              - "cat /build-pvc/shared_test.txt || echo 'FILE NOT FOUND'"
              - "ls -la /build-pvc"
            agents:
              queue: kubernetes
            plugins:
              - kubernetes:
                  podSpecPatch:
                    containers:
                      - name: container-0
                        volumeMounts:
                          - name: build-pvc
                            mountPath: /build-pvc
                    volumes:
                      - name: build-pvc
                        persistentVolumeClaim:
                          claimName: ${BUILD_PVC}

          - wait: ~
            continue_on_failure: true

          - label: "Delete build PVC"
            command:
              - "kubectl delete pvc ${BUILD_PVC} -n buildkite --ignore-not-found"
            agents:
              queue: kubernetes
            plugins:
              - kubernetes:
                  podSpecPatch:
                    serviceAccountName: buildkite-workspace-manager
        PIPELINEEOF
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            serviceAccountName: buildkite-workspace-manager
