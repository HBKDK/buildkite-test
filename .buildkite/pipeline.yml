steps:
  - label: "Setup: create PVC + upload steps"
    command:
      - |
        if ! command -v kubectl >/dev/null 2>&1; then
          echo "Installing kubectl..."
          curl -sLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          export PATH="/tmp:$PATH"
        fi

        export BUILD_ID="$BUILDKITE_BUILD_ID"
        export BUILD_PVC="bk-build-$BUILD_ID"
        echo "Build PVC name: $$BUILD_PVC"

        cat <<PVCEOF | kubectl apply -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: $$BUILD_PVC
          namespace: buildkite
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: nfs-client-bamboo-pv9
          resources:
            requests:
              storage: 5Gi
        PVCEOF

        kubectl wait --for=jsonpath='{.status.phase}'=Bound "pvc/$$BUILD_PVC" -n buildkite --timeout=60s

        buildkite-agent pipeline upload .buildkite/steps.yml
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            serviceAccountName: buildkite-workspace-manager
