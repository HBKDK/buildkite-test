steps:
  - label: "Writer step"
    key: "writer-step"
    command:
      - "hostname"
      - "echo host=$(hostname) build=$BUILD_PVC > /build-pvc/shared_test.txt"
      - "date >> /build-pvc/shared_test.txt"
      - "ls -la /build-pvc"
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: build-pvc
                    mountPath: /build-pvc
            volumes:
              - name: build-pvc
                persistentVolumeClaim:
                  claimName: $BUILD_PVC

  - label: "Reader step"
    key: "reader-step"
    depends_on: "writer-step"
    command:
      - "hostname"
      - "echo '--- checking file from previous step ---'"
      - "cat /build-pvc/shared_test.txt || echo 'FILE NOT FOUND'"
      - "ls -la /build-pvc"
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: build-pvc
                    mountPath: /build-pvc
            volumes:
              - name: build-pvc
                persistentVolumeClaim:
                  claimName: $BUILD_PVC

  - wait: ~
    continue_on_failure: true

  - label: "Delete build PVC"
    key: "delete-pvc"
    command:
      - "kubectl delete pvc $BUILD_PVC -n buildkite --ignore-not-found"
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            serviceAccountName: buildkite-workspace-manager
