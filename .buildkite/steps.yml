steps:
  - label: "Writer step"
    key: "writer-step"
    command:
      - "hostname"
      - "echo host=$(hostname) build=$BUILD_PVC > /build-pvc/shared_test.txt"
      - "date >> /build-pvc/shared_test.txt"
      - "ls -la /build-pvc"
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          metadata:
            labels:
              build-pvc-owner: "$BUILD_ID"
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: build-pvc
                    mountPath: /build-pvc
            volumes:
              - name: build-pvc
                persistentVolumeClaim:
                  claimName: $BUILD_PVC

  - label: "Reader step"
    key: "reader-step"
    depends_on: "writer-step"
    command:
      - "hostname"
      - "echo '--- checking file from previous step ---'"
      - "cat /build-pvc/shared_test.txt || echo 'FILE NOT FOUND'"
      - "ls -la /build-pvc"
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          metadata:
            labels:
              build-pvc-owner: "$BUILD_ID"
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: build-pvc
                    mountPath: /build-pvc
            volumes:
              - name: build-pvc
                persistentVolumeClaim:
                  claimName: $BUILD_PVC

  - wait: ~
    continue_on_failure: true

  - label: "Delete build PVC"
    key: "delete-pvc"
    command:
      - |
        if ! command -v kubectl >/dev/null 2>&1; then
          curl -sLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          export PATH="/tmp:$PATH"
        fi

        echo "Deleting sibling pods labeled build-pvc-owner=$BUILD_ID ..."
        kubectl delete pod -n buildkite -l "build-pvc-owner=$BUILD_ID" --ignore-not-found

        echo "Deleting PVC $BUILD_PVC ..."
        kubectl delete pvc $BUILD_PVC -n buildkite --ignore-not-found
    agents:
      queue: kubernetes
    plugins:
      - kubernetes:
          podSpecPatch:
            serviceAccountName: buildkite-workspace-manager
